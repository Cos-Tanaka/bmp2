server {
    listen 80;
    server_name _;

    # フロントエンド静的ファイル
    root /usr/share/nginx/html;
    index index.html;

    # バックエンドAPIへのリバースプロキシ
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # SPA フォールバック（将来的にルーティングを追加する場合）
    location / {
        try_files $uri $uri/ /index.html;
        # 毎回 ETag で再検証させる（未変更なら 304 で軽い）。Cache-Control が無いと
        # ブラウザが共通 JS（child-modal.js 等）を推測で長期キャッシュし、更新が反映されない
        add_header Cache-Control "no-cache";
    }

    # ヘルスチェック用
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
