<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM / 進捗監視盤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
    --border: #30363d; --border2: #3d444d;
    --text: #e6edf3; --text2: #8d96a0; --text3: #6e7681;
    --accent: #388bfd; --accent2: #1f6feb;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --purple: #a371f7;
    --font: 'Noto Sans JP', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    color-scheme: dark;
  }
  [data-theme="light"] { color-scheme: light; }
  [data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --bg4: #f1f3f5;
    --border: #d0d7de; --border2: #afb8c1;
    --text: #1f2328; --text2: #57606a; --text3: #8c959f;
    --accent: #0969da; --accent2: #0550ae;
    --green: #1a7f37; --yellow: #9a6700; --red: #cf222e; --purple: #8250df;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; min-height: 100vh; }

  /* Header */
  .header {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .05em; }
  .logo span { color: var(--text2); font-weight: 400; }
  .project-badge {
    background: var(--bg4); border: 1px solid var(--border2);
    border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text2); margin-left: 14px;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .sync-info { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    display: inline-block; margin-right: 6px; box-shadow: 0 0 6px var(--green);
  }
  .sync-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .sync-dot.loading { background: var(--yellow); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .btn-refresh, .btn-theme {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text2); padding: 4px 12px; font-size: 12px; cursor: pointer;
    font-family: var(--font); transition: .15s;
  }
  .btn-refresh:hover, .btn-theme:hover { border-color: var(--accent); color: var(--text); }

  /* Summary */
  .summary-bar { padding: 16px 24px; display: flex; gap: 12px; border-bottom: 1px solid var(--border); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; flex: 1; }
  .card-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .card-value { font-family: var(--mono); font-size: 22px; font-weight: 600; line-height: 1; }
  .card-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .val-blue{color:var(--accent)} .val-yellow{color:var(--yellow)} .val-red{color:var(--red)} .val-green{color:var(--green)}

  /* Filter */
  .filter-bar {
    padding: 10px 24px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .filter-label { font-size: 11px; color: var(--text3); }
  .chip {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 20px;
    padding: 3px 12px; font-size: 11px; cursor: pointer; color: var(--text2); transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent2); border-color: var(--accent); color: #fff; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .select-filter {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text2); padding: 3px 8px; font-size: 11px; cursor: pointer;
    font-family: var(--font); outline: none; transition: .15s;
  }
  .select-filter:hover { border-color: var(--accent); color: var(--text); }

  /* Table */
  .table-wrap { padding: 0 24px 32px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  thead th {
    background: var(--bg2); border-bottom: 1px solid var(--border2); border-top: 1px solid var(--border2);
    padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 500;
    color: var(--text3); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
    position: sticky; top: 53px; z-index: 10;
  }
  .row-parent td {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 10px 12px; vertical-align: middle;
  }
  .row-parent:hover td { background: var(--bg3); }
  .row-parent.expanded td { background: var(--bg3); border-bottom: none; }
  .row-child td {
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 8px 12px; vertical-align: middle; font-size: 12px;
  }
  .row-child:hover td { background: var(--bg2); }
  .row-child td:first-child { padding-left: 36px; border-left: 2px solid var(--border2); }
  .row-child.last-child td { border-bottom: 2px solid var(--border2); }

  .toggle-btn {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: 14px; width: 20px; text-align: center; transition: transform .2s;
    display: inline-block; line-height: 1; padding: 0; vertical-align: middle;
  }
  .toggle-btn.open { transform: rotate(90deg); }

  .issue-key { font-family: var(--mono); font-size: 11px; color: var(--accent); white-space: nowrap; margin-right: 8px; }
  .kintone-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 3px; vertical-align: middle;
    background: #00a0e9; color: #fff; font-family: var(--mono); font-size: 10px;
    font-weight: 700; text-decoration: none; margin-left: 6px; transition: .15s;
  }
  .kintone-link:hover { filter: brightness(1.15); }
  .issue-title { color: var(--text); font-weight: 500; }
  .issue-title-child { color: var(--text2); }

  .avatar {
    width: 22px; height: 22px; border-radius: 50%; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    margin-right: 6px; vertical-align: middle; background: rgba(56,139,253,.2); color: var(--accent);
  }

  .date-range { font-family: var(--mono); font-size: 11px; color: var(--text2); white-space: nowrap; }
  .date-range .sep { color: var(--text3); margin: 0 4px; }

  .hours-cell { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .hours-plan { color: var(--text2); } .hours-actual { color: var(--text); }

  .diff-cell { font-family: var(--mono); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .diff-over{color:var(--red)} .diff-ok{color:var(--green)} .diff-warn{color:var(--yellow)}

  .progress-wrap { min-width: 120px; }
  .progress-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .progress-row:last-child { margin-bottom: 0; }
  .progress-label { font-size: 10px; color: var(--text3); width: 20px; flex-shrink: 0; }
  .progress-bar-bg { flex: 1; height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
  .bar-plan { background: var(--accent); opacity: .5; }
  .bar-actual { background: var(--green); }
  .bar-actual-warn { background: var(--yellow); }
  .bar-actual-over { background: var(--red); }
  .progress-pct { font-family: var(--mono); font-size: 10px; color: var(--text2); width: 30px; text-align: right; flex-shrink: 0; }

  .status-badge { border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap; display: inline-block; }
  .s-1  { background: rgba(56,139,253,.15); color: var(--accent); border: 1px solid rgba(56,139,253,.3); }
  .s-2  { background: rgba(163,113,247,.15); color: var(--purple); border: 1px solid rgba(163,113,247,.3); }
  .s-3  { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
  .s-4  { background: rgba(210,153,34,.15); color: var(--yellow); border: 1px solid rgba(210,153,34,.3); }
  .s-default { background: rgba(110,118,129,.15); color: var(--text3); border: 1px solid var(--border2); }

  .count-badge {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 10px;
    padding: 1px 7px; font-size: 10px; color: var(--text3); margin-left: 6px; font-family: var(--mono);
  }
  .health { font-size: 16px; text-align: center; }

  /* 状態表示 */
  .state-overlay {
    padding: 60px; text-align: center; color: var(--text3);
  }
  .state-overlay .icon { font-size: 32px; margin-bottom: 12px; }
  .state-overlay .msg { font-size: 14px; }
  .state-overlay .sub { font-size: 12px; margin-top: 6px; color: var(--text3); }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 子課題詳細モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 1000; padding: 60px 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px;
    width: 100%; max-width: 560px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    animation: modalIn .18s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-head .m-key { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 4px; display: inline-block; }
  .modal-head .m-title { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .modal-close {
    background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer;
    line-height: 1; padding: 0 4px; flex-shrink: 0; transition: .15s;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 16px 20px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .m-field { display: flex; flex-direction: column; gap: 3px; }
  .m-field.full { grid-column: 1 / -1; }
  .m-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
  .m-value { font-size: 13px; color: var(--text); }
  .m-value.mono { font-family: var(--mono); }
  .m-select {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text); padding: 5px 8px; font-size: 13px; font-family: var(--font);
    outline: none; cursor: pointer; width: 100%; transition: .15s;
  }
  .m-select:hover { border-color: var(--accent); }
  .m-select:focus { border-color: var(--accent); }
  .modal-foot {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  }
  .m-msg { margin-right: auto; font-size: 12px; }
  .m-msg.ok { color: var(--green); } .m-msg.err { color: var(--red); }
  .m-save {
    background: var(--green); border: 1px solid var(--green); color: #fff;
    border-radius: 6px; padding: 6px 16px; font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: var(--font); transition: .15s;
  }
  .m-save:hover { filter: brightness(1.1); }
  .m-save:disabled { opacity: .5; cursor: default; }

  /* 実績工数入力レイヤー */
  .hours-actual-edit { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .hours-actual-edit:hover { color: var(--accent); }
  .w-form { display: flex; flex-direction: column; gap: 12px; }
  .w-form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 4px; }
  .w-history { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
  .w-history-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .w-hist-row {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .w-hist-row:last-child { border-bottom: none; }
  .w-hist-name { color: var(--text); }
  .w-hist-date { font-family: var(--mono); font-size: 11px; color: var(--text3); white-space: nowrap; }
  .w-hist-hours { font-family: var(--mono); font-weight: 600; color: var(--green); white-space: nowrap; text-align: right; }
  .w-hist-del {
    background: none; border: none; cursor: pointer; font-size: 13px; line-height: 1;
    padding: 2px 4px; border-radius: 4px; opacity: .55;
  }
  .w-hist-del:hover { opacity: 1; background: var(--bg3, rgba(128,128,128,.15)); }
  .w-hist-del:disabled { opacity: .3; cursor: default; }
  .w-hist-empty { font-size: 12px; color: var(--text3); padding: 6px 0; }
  .m-link {
    display: inline-block; background: var(--accent2); border: 1px solid var(--accent);
    color: #fff; border-radius: 6px; padding: 6px 14px; font-size: 12px;
    text-decoration: none; transition: .15s;
  }
  .m-link:hover { background: var(--accent); }
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center">
    <div class="logo">BPM<span> / 進捗監視盤</span></div>
    <div class="project-badge" id="projectBadge">読込中...</div>
  </div>
  <div class="header-right">
    <span class="sync-info"><span class="sync-dot loading" id="syncDot"></span><span id="syncText">取得中...</span></span>
    <a class="btn-refresh" href="/worklog.html" target="_blank" rel="noopener" style="text-decoration:none">📊 実施工数確認</a>
    <a class="btn-refresh" href="/guide.html" target="_blank" rel="noopener" style="text-decoration:none">❓ 使い方</a>
    <button class="btn-theme" id="btnTheme" onclick="toggleTheme()">☀ ライト</button>
    <button class="btn-refresh" onclick="fetchData(true)">↻ 更新</button>
  </div>
</header>

<div class="summary-bar">
  <div class="card">
    <div class="card-label">案件数</div>
    <div class="card-value val-blue" id="cntTotal">—</div>
    <div class="card-sub" id="cntSub">—</div>
  </div>
  <div class="card">
    <div class="card-label">予定工数合計</div>
    <div class="card-value" id="cntPlanned">— <span style="font-size:14px;color:var(--text3)">h</span></div>
    <div class="card-sub" id="cntPlannedSub">—</div>
  </div>
  <div class="card">
    <div class="card-label">実績工数合計</div>
    <div class="card-value" id="cntActual">— <span style="font-size:14px;color:var(--text3)">h</span></div>
    <div class="card-sub" id="cntActualSub">—</div>
  </div>
  <div class="card">
    <div class="card-label">予実差</div>
    <div class="card-value" id="cntDiff">—</div>
    <div class="card-sub" id="cntDiffSub">—</div>
  </div>
  <div class="card">
    <div class="card-label">健全性</div>
    <div class="card-value" id="cntHealth" style="font-size:18px;padding-top:2px">—</div>
    <div class="card-sub" id="cntHealthSub">—</div>
  </div>
</div>

<div class="filter-bar">
  <span class="filter-label">健全性</span>
  <button class="chip active" onclick="setFilter('health','all',this)">すべて</button>
  <button class="chip" onclick="setFilter('health','green',this)">🟢 正常</button>
  <button class="chip" onclick="setFilter('health','yellow',this)">🟡 注意</button>
  <button class="chip" onclick="setFilter('health','red',this)">🔴 危険</button>
  <div class="filter-sep"></div>
  <span class="filter-label">状態</span>
  <button class="chip" id="filterWip" onclick="toggleStatusFilter('wip',this)">対応中</button>
  <button class="chip" id="filterDone" onclick="toggleStatusFilter('done',this)">完了</button>
  <div class="filter-sep"></div>
  <span class="filter-label">担当者</span>
  <select class="select-filter" id="assigneeFilter" onchange="setAssigneeFilter(this.value)">
    <option value="all">すべて</option>
  </select>
  <div class="filter-sep"></div>
  <span class="filter-label">子課題ソート</span>
  <select class="select-filter" id="childSortFilter" onchange="setChildSortFilter(this.value)">
    <option value="assignee-date">担当者 ➔ 期間</option>
    <option value="date-assignee">期間 ➔ 担当者</option>
  </select>
  <div class="filter-sep"></div>
  <span class="filter-label">表示</span>
  <button class="chip" onclick="setAllExpanded(true)">▼ 全て開く</button>
  <button class="chip" onclick="setAllExpanded(false)">▶ 全て閉じる</button>
</div>
<div class="filter-bar" style="border-top:none">
  <span class="filter-label">ステータス</span>
  <button class="chip active" onclick="setCustomStatusFilter('all',this)">すべて</button>
  <button class="chip" onclick="setCustomStatusFilter('見積',this)">概算見積</button>
  <button class="chip" onclick="setCustomStatusFilter('設計',this)">基本設計</button>
  <button class="chip" onclick="setCustomStatusFilter('正式',this)">正式見積</button>
  <button class="chip" onclick="setCustomStatusFilter('開発',this)">開発中</button>
  <button class="chip" onclick="setCustomStatusFilter('テスト',this)">テストリリース済み</button>
  <button class="chip" onclick="setCustomStatusFilter('本番',this)">本番リリース済み</button>
</div>

<div class="modal-overlay" id="childModal" onclick="if(event.target===this)closeChildModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div>
        <span class="m-key" id="mKey"></span>
        <div class="m-title" id="mTitle"></div>
      </div>
      <button class="modal-close" onclick="closeChildModal()" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <div class="m-grid" id="mGrid"></div>
    </div>
    <div class="modal-foot">
      <span class="m-msg" id="mMsg"></span>
      <button class="m-save" id="mSave" onclick="saveChildEdits()">保存</button>
      <a class="m-link" id="mLink" href="#" target="_blank">Backlog で開く ↗</a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="worklogModal" onclick="if(event.target===this)closeWorklogModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div>
        <span class="m-key" id="wKey"></span>
        <div class="m-title" id="wTitle"></div>
      </div>
      <button class="modal-close" onclick="closeWorklogModal()" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <div class="w-form">
        <div class="m-field">
          <span class="m-label">追加工数 (h) <span style="color:var(--red)">*</span></span>
          <input type="number" step="0.25" min="0" class="m-select" id="wHours" placeholder="例: 1.5">
        </div>
        <div class="m-field">
          <span class="m-label">名前 <span style="color:var(--red)">*</span></span>
          <input type="text" class="m-select" id="wName" placeholder="入力者名">
        </div>
        <div class="m-field">
          <span class="m-label">日時 <span style="color:var(--red)">*</span></span>
          <input type="datetime-local" class="m-select" id="wDate">
        </div>
        <div class="w-form-foot">
          <span class="m-msg" id="wMsg"></span>
          <button class="m-save" id="wAdd" onclick="addWorklog()">追加</button>
        </div>
      </div>
      <div class="w-history">
        <div class="w-history-title">入力履歴</div>
        <div id="wHistory"></div>
      </div>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:36px"></th>
        <th style="min-width:260px">案件 / 課題</th>
        <th>担当者</th>
        <th>期間</th>
        <th style="text-align:right">予定(h)</th>
        <th style="text-align:right">実績(h)</th>
        <th style="text-align:right">差分(h)</th>
        <th style="text-align:right">残工数(h)</th>
        <th style="min-width:140px">進捗（予定/実績）</th>
        <th>状態</th>
        <th>ステータス / チェック状態</th>
        <th>健全性</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
// ── 状態 ──────────────────────────────────────────
let allData = [];
let fieldOptions = null;          // 進捗率・チェック状態の選択肢
let modalChildId = null;          // 現在モーダルで開いている子課題ID
let modalOriginal = {};           // モーダル表示時の初期選択値（変更検知用）
let filter = { health: 'all', status: null, assignee: 'all', customStatus: 'all', childSort: 'assignee-date' };
const POLL_MS = 60000; // 60秒ポーリング
const FILTER_KEY = 'bpm2-filter';

// ── フィルタの保存・復元 ──────────────────────────
function saveFilter() {
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(filter)); } catch (e) {}
}

function loadFilter() {
  try {
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || '{}');
    // 既知のキーだけを取り込む（不正値は無視）
    for (const k of Object.keys(filter)) {
      if (saved[k] !== undefined) filter[k] = saved[k];
    }
  } catch (e) {}
}

// 保存されたフィルタを UI コントロール（チップ・セレクト）へ反映
function applyFilterUI() {
  document.querySelectorAll('.filter-bar .chip').forEach(c => {
    const oc = c.getAttribute('onclick') || '';
    let m;
    if ((m = oc.match(/setFilter\('health','([^']+)'/))) {
      c.classList.toggle('active', m[1] === filter.health);
    } else if ((m = oc.match(/setCustomStatusFilter\('([^']+)'/))) {
      c.classList.toggle('active', m[1] === filter.customStatus);
    } else if ((m = oc.match(/toggleStatusFilter\('([^']+)'/))) {
      c.classList.toggle('active', m[1] === filter.status);
    }
  });
  const sort = document.getElementById('childSortFilter');
  if (sort) sort.value = filter.childSort;
  // 担当者セレクトは取得後 updateAssigneeFilter() で選択肢生成・反映される
}

// ── 編集用フィールド選択肢の取得 ──────────────────
async function loadFieldOptions() {
  try {
    const res = await fetch('/api/field-options');
    if (res.ok) fieldOptions = await res.json();
  } catch (e) { /* 選択肢取得失敗時はモーダルで閲覧のみ */ }
}

// ── API 取得 ──────────────────────────────────────
async function fetchData(force = false) {
  setSyncState('loading');
  try {
    const url = '/api/issues' + (force ? '?t=' + Date.now() : '');
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allData = await res.json();
    updateAssigneeFilter();
    updateSummary();
    renderTable();
    setSyncState('ok');
  } catch (e) {
    setSyncState('error', e.message);
  }
}

function setSyncState(state, msg = '') {
  const dot  = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  dot.className = 'sync-dot';
  if (state === 'loading') {
    dot.classList.add('loading');
    text.textContent = '取得中...';
  } else if (state === 'ok') {
    text.textContent = '最終同期: ' + new Date().toLocaleTimeString('ja-JP');
  } else {
    dot.classList.add('error');
    text.textContent = 'エラー: ' + msg;
  }
}

// ── サマリー ──────────────────────────────────────
function updateSummary() {
  const total   = allData.length;
  const done    = allData.filter(r => isParentDone(r)).length;
  const wip     = allData.filter(r => !isParentDone(r)).length;
  const planned = allData.reduce((s, r) => s + r.plannedH, 0);
  const actual  = allData.reduce((s, r) => s + r.actualH,  0);
  const diff    = actual - planned;
  const green   = allData.filter(r => r.health === 'green').length;
  const yellow  = allData.filter(r => r.health === 'yellow').length;
  const red     = allData.filter(r => r.health === 'red').length;

  // プロジェクトバッジ
  document.getElementById('projectBadge').textContent =
    allData.length ? allData[0].id.split('-')[0] + ' プロジェクト' : '';

  setText('cntTotal', total, 'val-blue');
  document.getElementById('cntSub').textContent = `進行中 ${wip} ／ 完了 ${done}`;

  setText('cntPlanned', planned + ' ', '');
  document.getElementById('cntPlannedSub').textContent = `子課題 ${allData.reduce((s,r)=>s+r.children.length,0)} 件の合計`;

  const actualEl = document.getElementById('cntActual');
  actualEl.innerHTML = actual + ' <span style="font-size:14px;color:var(--text3)">h</span>';
  actualEl.className = 'card-value ' + (actual > planned ? 'val-yellow' : 'val-green');
  document.getElementById('cntActualSub').textContent = planned > 0 ? `消化率 ${Math.round(actual/planned*100)}%` : '';

  const diffEl = document.getElementById('cntDiff');
  diffEl.innerHTML = (diff >= 0 ? '+' : '') + diff + ' <span style="font-size:14px;color:var(--text3)">h</span>';
  diffEl.className = 'card-value ' + (diff > 0 ? 'val-red' : 'val-green');
  document.getElementById('cntDiffSub').textContent = red + ' 案件が超過中';

  document.getElementById('cntHealth').innerHTML =
    `🟢<span style="font-size:13px;color:var(--text2)"> ${green}</span>&nbsp;` +
    `🟡<span style="font-size:13px;color:var(--text2)"> ${yellow}</span>&nbsp;` +
    `🔴<span style="font-size:13px;color:var(--text2)"> ${red}</span>`;
  document.getElementById('cntHealthSub').textContent = `要確認 ${red} 件`;
}

function setText(id, val, cls) {
  const el = document.getElementById(id);
  el.textContent = val;
  if (cls) el.className = 'card-value ' + cls;
}

// ── テーブル描画 ──────────────────────────────────
function isParentDone(row) {
  return row.children.length > 0 && row.children.every(c => c.statusId === 3);
}

function planProgress(start, due) {
  const today = new Date(); today.setHours(0,0,0,0);
  const s = new Date(start), d = new Date(due);
  if (!start || !due) return 0;
  if (today <= s) return 0;
  if (today >= d) return 100;
  return Math.round((today - s) / (d - s) * 100);
}

function diffHTML(plan, actual) {
  const d = actual - plan;
  const sign = d >= 0 ? '+' : '';
  const cls = d > plan * 0.2 ? 'diff-over' : d > 0 ? 'diff-warn' : 'diff-ok';
  return `<span class="diff-cell ${cls}">${sign}${d}</span>`;
}

const HOURS_PER_MM = 160;

function remainingColor(remaining, plannedH, actualH) {
  const diff = actualH - plannedH;
  if (diff > 0) return 'diff-over';
  if (diff < 0 && Math.abs(diff) < remaining) return 'diff-warn';
  if (diff < 0 && Math.abs(diff) > remaining) return 'val-blue';
  return 'diff-ok';
}

function remainingHTML(remaining, plannedH, actualH) {
  if (remaining == null) return '<span style="color:var(--text3)">—</span>';
  const cls = remainingColor(remaining, plannedH, actualH);
  return `<span class="diff-cell ${cls}">${remaining}h</span>`;
}

function remainingMMHTML(remaining, plannedH, actualH) {
  if (remaining == null) return '<span style="color:var(--text3)">—</span>';
  const cls = remainingColor(remaining, plannedH, actualH);
  const mm = Math.round(remaining / HOURS_PER_MM / 0.25) * 0.25;
  return `<span class="diff-cell ${cls}">${mm}人月</span>`;
}

function progressBars2(planPct, actualPct) {
  const cls = actualPct > 100 ? 'bar-actual-over' : actualPct > planPct + 10 ? 'bar-actual-warn' : 'bar-actual';
  return `<div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-label">予</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill bar-plan" style="width:${Math.min(planPct,100)}%"></div></div>
      <span class="progress-pct">${planPct}%</span>
    </div>
    <div class="progress-row">
      <span class="progress-label">実</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill ${cls}" style="width:${Math.min(actualPct,100)}%"></div></div>
      <span class="progress-pct">${actualPct}%</span>
    </div>
  </div>`;
}

function progressBar1(pct) {
  const cls = pct > 100 ? 'bar-actual-over' : 'bar-actual';
  return `<div class="progress-wrap">
    <div class="progress-row">
      <div class="progress-bar-bg"><div class="progress-bar-fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div>
      <span class="progress-pct">${pct}%</span>
    </div>
  </div>`;
}

function statusBadge(statusId, statusName) {
  const cls = statusId <= 4 ? `s-${statusId}` : 's-default';
  return `<span class="status-badge ${cls}">${statusName}</span>`;
}

// Kintone番号があれば kintone レコードへのリンクアイコンを返す（無ければ非表示）
function kintoneIcon(url) {
  if (!url) return '';
  return ` <a href="${url}" target="_blank" class="kintone-link" title="kintone で開く" onclick="event.stopPropagation()">k</a>`;
}

function avatarHTML(name) {
  const initial = name ? name[0] : '?';
  return `<span class="avatar">${initial}</span>${name || '未割当'}`;
}

function dateRange(start, due) {
  if (!start && !due) return '<span style="color:var(--text3)">—</span>';
  return `<span class="date-range">${start || '?'}<span class="sep">→</span>${due || '?'}</span>`;
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  const rows = allData.filter(row => {
    if (filter.health !== 'all' && row.health !== filter.health) return false;
    if (filter.status === 'done'  && !isParentDone(row)) return false;
    if (filter.status === 'wip'   && isParentDone(row))  return false;
    // 担当者: 親が一致、または子課題に一致があれば表示（親の担当者が異なっても表示する）
    if (filter.assignee !== 'all'
        && row.assignee !== filter.assignee
        && !row.children.some(c => c.assignee === filter.assignee)) return false;
    
    // カスタムステータスのフィルタリング
    if (filter.customStatus !== 'all') {
      if (!row.customStatus) return false;
      const match = row.customStatus.match(/^(\d+)/);
      if (!match) return false;
      const num = parseInt(match[1], 10);
      
      if (filter.customStatus === '見積') {
        if (num < 0 || num > 19) return false;
      } else if (filter.customStatus === '設計') {
        if (num < 20 || num > 29) return false;
      } else if (filter.customStatus === '正式') {
        if (num < 30 || num > 39) return false;
      } else if (filter.customStatus === '開発') {
        if (num < 40 || num > 49) return false;
      } else if (filter.customStatus === 'テスト') {
        if (num < 59 || num > 60) return false;
      } else if (filter.customStatus === '本番') {
        if (num !== 69) return false;
      }
    }
    return true;
  });

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="12" style="padding:48px;text-align:center;color:var(--text3)">該当する案件がありません</td></tr>`;
    return;
  }

  rows.forEach(row => {
    const pp  = planProgress(row.start, row.due);
    const ap  = row.plannedH > 0 ? Math.round(row.actualH / row.plannedH * 100) : 0;
    const health = row.health === 'green' ? '🟢' : row.health === 'yellow' ? '🟡' : '🔴';

    // 担当者フィルタ時: 親が一致しない場合は一致する子課題のみ表示し、自動展開する
    const assigneeActive = filter.assignee !== 'all';
    const parentMatches  = !assigneeActive || row.assignee === filter.assignee;
    const visibleChildren = parentMatches
      ? row.children
      : row.children.filter(c => c.assignee === filter.assignee);
    const autoExpand = assigneeActive && visibleChildren.length > 0;
    const countBadge = visibleChildren.length === row.children.length
      ? `${row.children.length}`
      : `${visibleChildren.length}/${row.children.length}`;

    // 親行
    const tr = document.createElement('tr');
    tr.className = 'row-parent' + (autoExpand ? ' expanded' : '');
    tr.dataset.id = row.id;
    tr.innerHTML = `
      <td><button class="toggle-btn${autoExpand ? ' open' : ''}" onclick="toggle('${row.id}',this)">▶</button></td>
      <td>
        <a href="${row.url}" target="_blank" class="issue-key">${row.id}</a>
        <span class="issue-title">${escHtml(row.title)}</span>${kintoneIcon(row.kintoneUrl)}
        <span class="count-badge">${countBadge}</span>
      </td>
      <td>${avatarHTML(row.assignee)}</td>
      <td>${dateRange(row.start, row.due)}</td>
      <td style="text-align:right"><span class="hours-cell hours-plan">${row.plannedH}h</span></td>
      <td style="text-align:right"><span class="hours-cell hours-actual">${row.actualH}h</span></td>
      <td style="text-align:right">${diffHTML(row.plannedH, row.actualH)}</td>
      <td style="text-align:right">${remainingMMHTML(row.remainingH, row.plannedH, row.actualH)}</td>
      <td>${progressBars2(pp, ap)}</td>
      <td>${statusBadge(row.statusId, row.status)}</td>
      <td>${row.customStatus ? `<span class="status-badge s-default">${escHtml(row.customStatus)}</span>` : '<span style="color:var(--text3)">—</span>'}</td>
      <td class="health">${health}</td>
    `;
    tbody.appendChild(tr);

    // 子課題のソート
    const sortedChildren = [...visibleChildren].sort((a, b) => {
      if (filter.childSort === 'assignee-date') {
        const nameA = a.assignee || '未割当';
        const nameB = b.assignee || '未割当';
        if (nameA !== nameB) {
          return nameA.localeCompare(nameB, 'ja');
        }
        const startA = a.start || '9999-12-31';
        const startB = b.start || '9999-12-31';
        return startA.localeCompare(startB);
      } else {
        const startA = a.start || '9999-12-31';
        const startB = b.start || '9999-12-31';
        if (startA !== startB) {
          return startA.localeCompare(startB);
        }
        const nameA = a.assignee || '未割当';
        const nameB = b.assignee || '未割当';
        return nameA.localeCompare(nameB, 'ja');
      }
    });

    // 子行
    sortedChildren.forEach((c, idx) => {
      const cpct = c.progress !== null ? c.progress : (c.plannedH > 0 ? Math.round(c.actualH / c.plannedH * 100) : 0);
      const cr = document.createElement('tr');
      cr.className = 'row-child' + (idx === sortedChildren.length - 1 ? ' last-child' : '');
      cr.dataset.parent = row.id;
      cr.style.display = autoExpand ? '' : 'none';
      cr.innerHTML = `
        <td></td>
        <td>
          <a href="${c.url}" target="_blank" class="issue-key">${c.id}</a>
          <span class="issue-title-child" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px" onclick="openChildModal('${c.id}')" title="詳細を表示">${escHtml(c.title)}</span>
        </td>
        <td>${avatarHTML(c.assignee)}</td>
        <td>${dateRange(c.start, c.due)}</td>
        <td style="text-align:right"><span class="hours-cell hours-plan">${c.plannedH}h</span></td>
        <td style="text-align:right"><span class="hours-cell hours-actual hours-actual-edit" onclick="openWorklogModal('${c.id}')" title="実績工数を入力">${c.actualH}h</span></td>
        <td style="text-align:right">${diffHTML(c.plannedH, c.actualH)}</td>
        <td style="text-align:right">${remainingHTML(c.remainingH, c.plannedH, c.actualH)}</td>
        <td>${progressBar1(cpct)}</td>
        <td>${statusBadge(c.statusId, c.status)}</td>
        <td>${c.checkStatus ? `<span class="status-badge s-default">${escHtml(c.checkStatus)}</span>` : '<span style="color:var(--text3)">—</span>'}</td>
        <td></td>
      `;
      tbody.appendChild(cr);
    });
  });
}

function toggle(id, btn) {
  const isOpen = btn.classList.toggle('open');
  document.querySelector(`[data-id="${id}"]`).classList.toggle('expanded', isOpen);
  document.querySelectorAll(`[data-parent="${id}"]`).forEach(r => r.style.display = isOpen ? '' : 'none');
}

// 全親課題の一括開閉
function setAllExpanded(open) {
  const tbody = document.getElementById('tableBody');
  tbody.querySelectorAll('.row-parent').forEach(tr => {
    tr.classList.toggle('expanded', open);
    const btn = tr.querySelector('.toggle-btn');
    if (btn) btn.classList.toggle('open', open);
  });
  tbody.querySelectorAll('.row-child').forEach(r => r.style.display = open ? '' : 'none');
}

// ── 子課題詳細モーダル ────────────────────────────
function findChild(childId) {
  for (const row of allData) {
    const c = row.children.find(k => k.id === childId);
    if (c) return { child: c, parent: row };
  }
  return null;
}

// 選択肢を <option> 文字列に変換。現在値(name一致)を選択状態にする
function optionsHTML(items, currentName) {
  return items.map(it =>
    `<option value="${it.id}"${String(it.name) === String(currentName) ? ' selected' : ''}>${escHtml(it.name)}</option>`
  ).join('');
}

function editFieldHTML(label, selectId, items, currentName) {
  if (!items) {
    // 選択肢が取れない場合は閲覧表示にフォールバック
    return `<div class="m-field">
      <span class="m-label">${label}</span>
      <span class="m-value">${escHtml(currentName || '—')}</span>
    </div>`;
  }
  return `<div class="m-field">
    <span class="m-label">${label}</span>
    <select class="m-select" id="${selectId}">${optionsHTML(items, currentName)}</select>
  </div>`;
}

function openChildModal(childId) {
  const found = findChild(childId);
  if (!found) return;
  const { child: c, parent: p } = found;
  modalChildId = childId;

  document.getElementById('mKey').textContent = c.id;
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mLink').href = c.url;
  setModalMsg('', '');

  const progItems  = fieldOptions && fieldOptions.progress    ? fieldOptions.progress.items    : null;
  const checkItems = fieldOptions && fieldOptions.checkStatus ? fieldOptions.checkStatus.items : null;

  // 閲覧専用フィールド
  const readonly = [
    ['親案件', `${escHtml(p.id)} ${escHtml(p.title)}`, true],
    ['担当者', escHtml(c.assignee || '未割当')],
    ['予定工数', c.plannedH + ' h', false, true],
    ['実績工数', c.actualH + ' h', false, true],
    ['差分', (c.actualH - c.plannedH >= 0 ? '+' : '') + (c.actualH - c.plannedH) + ' h', false, true],
    ['残工数', (c.remainingH != null ? c.remainingH + ' h' : '—'), false, true],
    ['状態', escHtml(c.status || '—')],
  ].map(([label, val, full, mono]) =>
    `<div class="m-field${full ? ' full' : ''}">
      <span class="m-label">${label}</span>
      <span class="m-value${mono ? ' mono' : ''}">${val}</span>
    </div>`
  ).join('');

  // 編集可能フィールド（開始日・期限日・進捗率・チェック状態）
  const editable =
    `<div class="m-field">
      <span class="m-label">開始日</span>
      <input type="date" class="m-select" id="mStart" value="${c.start || ''}">
    </div>` +
    `<div class="m-field">
      <span class="m-label">期限日</span>
      <input type="date" class="m-select" id="mDue" value="${c.due || ''}">
    </div>` +
    editFieldHTML('進捗率', 'mProgress', progItems, c.progress != null ? c.progress : '') +
    editFieldHTML('チェック状態', 'mCheckStatus', checkItems, c.checkStatus || '');

  document.getElementById('mGrid').innerHTML = readonly + editable;

  // 変更検知用に初期値を保持
  const progEl  = document.getElementById('mProgress');
  const checkEl = document.getElementById('mCheckStatus');
  modalOriginal = {
    progress:    progEl  ? progEl.value  : null,
    checkStatus: checkEl ? checkEl.value : null,
    start:       c.start || '',
    due:         c.due   || '',
  };

  document.getElementById('childModal').classList.add('open');
}

function setModalMsg(text, cls) {
  const el = document.getElementById('mMsg');
  el.textContent = text;
  el.className = 'm-msg' + (cls ? ' ' + cls : '');
}

async function saveChildEdits() {
  if (!modalChildId) return;
  const progEl  = document.getElementById('mProgress');
  const checkEl = document.getElementById('mCheckStatus');
  const startEl = document.getElementById('mStart');
  const dueEl   = document.getElementById('mDue');
  const payload = {};
  // 変更があった項目だけを送る（同値だと Backlog が "No comment content" で弾くため）
  if (progEl  && progEl.value  !== modalOriginal.progress)    payload.progressItemId    = parseInt(progEl.value, 10);
  if (checkEl && checkEl.value !== modalOriginal.checkStatus) payload.checkStatusItemId = parseInt(checkEl.value, 10);
  if (startEl && startEl.value !== modalOriginal.start)       payload.startDate = startEl.value;
  if (dueEl   && dueEl.value   !== modalOriginal.due)         payload.dueDate   = dueEl.value;

  if (Object.keys(payload).length === 0) {
    setModalMsg('変更がありません', '');
    return;
  }

  if (startEl && dueEl && startEl.value && dueEl.value && startEl.value > dueEl.value) {
    setModalMsg('開始日が期限日より後になっています', 'err');
    return;
  }

  const btn = document.getElementById('mSave');
  btn.disabled = true;
  setModalMsg('保存中...', '');
  try {
    const res = await fetch('/api/issue/' + encodeURIComponent(modalChildId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try { const j = await res.json(); if (j.error) detail = j.error; } catch (e) {}
      throw new Error(detail);
    }
    setModalMsg('保存しました', 'ok');
    // 保存後の値を初期値として更新（連続保存での誤再送を防止）
    if (progEl)  modalOriginal.progress    = progEl.value;
    if (checkEl) modalOriginal.checkStatus = checkEl.value;
    if (startEl) modalOriginal.start       = startEl.value;
    if (dueEl)   modalOriginal.due         = dueEl.value;
    await fetchData(true);   // 背景テーブルを最新化
  } catch (e) {
    setModalMsg('保存失敗: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function closeChildModal() {
  modalChildId = null;
  document.getElementById('childModal').classList.remove('open');
}

// ── 実績工数 日々入力レイヤー ─────────────────────
let worklogChildId = null;
const WORKLOG_NAME_KEY = 'bpm2-worklog-name';

async function openWorklogModal(childId) {
  const found = findChild(childId);
  if (!found) return;
  const { child: c } = found;
  worklogChildId = childId;

  document.getElementById('wKey').textContent = c.id;
  document.getElementById('wTitle').textContent = c.title;
  document.getElementById('wHours').value = '';
  // 名前は前回入力をブラウザから復元
  document.getElementById('wName').value = localStorage.getItem(WORKLOG_NAME_KEY) || '';
  document.getElementById('wDate').value = nowLocalDatetime();
  setWorklogMsg('', '');
  document.getElementById('wHistory').innerHTML = '<div class="w-hist-empty">読込中...</div>';
  document.getElementById('worklogModal').classList.add('open');

  await loadWorklogHistory(childId);
}

function nowLocalDatetime() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

let worklogRows = [];   // 表示中の履歴（削除時の確認メッセージ用）

async function loadWorklogHistory(childId) {
  const box = document.getElementById('wHistory');
  try {
    const res = await fetch('/api/worklog/' + encodeURIComponent(childId));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    worklogRows = rows;
    if (!rows.length) {
      box.innerHTML = '<div class="w-hist-empty">履歴はありません</div>';
      return;
    }
    box.innerHTML = rows.map(r =>
      `<div class="w-hist-row">
        <span class="w-hist-name">${escHtml(r.name)}</span>
        <span class="w-hist-date">${fmtDateTime(r.added_at)}</span>
        <span class="w-hist-hours">+${r.hours}h</span>
        <button class="w-hist-del" onclick="deleteWorklog(${r.id})" title="この履歴を削除" aria-label="削除">🗑</button>
      </div>`
    ).join('');
  } catch (e) {
    box.innerHTML = `<div class="w-hist-empty">履歴の取得に失敗しました (${escHtml(e.message)})</div>`;
  }
}

async function deleteWorklog(entryId) {
  if (!worklogChildId) return;
  const r = worklogRows.find(x => x.id === entryId);
  if (!r) return;
  const ok = confirm(
    `この入力履歴を削除しますか？\n\n` +
    `${r.name}  ${fmtDateTime(r.added_at)}  +${r.hours}h\n\n` +
    `子課題の実績工数から ${r.hours}h 減算されます（0 未満になる場合は 0 になります）。`
  );
  if (!ok) return;

  document.querySelectorAll('.w-hist-del').forEach(b => b.disabled = true);
  setWorklogMsg('削除中...', '');
  try {
    const res = await fetch('/api/worklog/entry/' + entryId, { method: 'DELETE' });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try { const j = await res.json(); if (j.error) detail = j.error; } catch (e) {}
      throw new Error(detail);
    }
    setWorklogMsg('削除しました', 'ok');
  } catch (e) {
    setWorklogMsg('削除失敗: ' + e.message, 'err');
  } finally {
    await loadWorklogHistory(worklogChildId);   // 成否に関わらず履歴を最新化（ボタンも再有効化）
    await fetchData(true);                       // 背景テーブルを最新化
  }
}

function setWorklogMsg(text, cls) {
  const el = document.getElementById('wMsg');
  el.textContent = text;
  el.className = 'm-msg' + (cls ? ' ' + cls : '');
}

async function addWorklog() {
  if (!worklogChildId) return;
  const found = findChild(worklogChildId);
  if (!found) return;
  const { child: c, parent: p } = found;

  const hoursRaw = document.getElementById('wHours').value.trim();
  const name = document.getElementById('wName').value.trim();
  const addedAt = document.getElementById('wDate').value;

  // 入力された名前はブラウザに保持（次回表示時に復元）
  if (name) { try { localStorage.setItem(WORKLOG_NAME_KEY, name); } catch (e) {} }

  // バリデーション: 全項目必須・追加工数は数値のみ
  if (!hoursRaw && !name) { setWorklogMsg('追加工数(h) と 名前 は必須です', 'err'); return; }
  if (!name) { setWorklogMsg('名前は必須です', 'err'); return; }
  if (!hoursRaw) { setWorklogMsg('追加工数(h) は必須です', 'err'); return; }
  const hours = Number(hoursRaw);
  if (!Number.isFinite(hours)) { setWorklogMsg('追加工数(h) は数値で入力してください', 'err'); return; }
  if (hours <= 0) { setWorklogMsg('追加工数(h) は 0 より大きい数値で入力してください', 'err'); return; }
  if (!addedAt) { setWorklogMsg('日時は必須です', 'err'); return; }

  const btn = document.getElementById('wAdd');
  btn.disabled = true;
  setWorklogMsg('追加中...', '');
  try {
    const res = await fetch('/api/worklog/' + encodeURIComponent(worklogChildId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hours, name, addedAt, parentKey: p.id, parentTitle: p.title }),
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try { const j = await res.json(); if (j.error) detail = j.error; } catch (e) {}
      throw new Error(detail);
    }
    setWorklogMsg('追加しました', 'ok');
    document.getElementById('wHours').value = '';
    document.getElementById('wDate').value = nowLocalDatetime();
    await loadWorklogHistory(worklogChildId);   // 履歴更新
    await fetchData(true);                        // 背景テーブルを最新化
  } catch (e) {
    setWorklogMsg('追加失敗: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function closeWorklogModal() {
  worklogChildId = null;
  document.getElementById('worklogModal').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeChildModal(); closeWorklogModal(); }
});

// ── フィルター ────────────────────────────────────
function setFilter(key, val, btn) {
  filter[key] = val;
  btn.closest('.filter-bar').querySelectorAll('.chip').forEach(c => {
    if (['すべて','🟢 正常','🟡 注意','🔴 危険'].some(t => c.textContent.trim() === t)) c.classList.remove('active');
  });
  btn.classList.add('active');
  saveFilter();
  renderTable();
}
function toggleStatusFilter(val, btn) {
  if (btn.classList.contains('active')) {
    btn.classList.remove('active');
    filter.status = null;
  } else {
    document.querySelectorAll('#filterWip,#filterDone').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter.status = val;
  }
  saveFilter();
  renderTable();
}

// ── ユーティリティ ────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateAssigneeFilter() {
  const select = document.getElementById('assigneeFilter');
  if (!select) return;
  const currentVal = filter.assignee;
  
  // 親課題・子課題の担当者を抽出してソート
  const assignees = [...new Set(
    allData.flatMap(r => [r.assignee, ...r.children.map(c => c.assignee)]).filter(Boolean)
  )].sort();
  
  let html = '<option value="all">すべて</option>';
  assignees.forEach(a => {
    html += `<option value="${a}">${a}</option>`;
  });
  select.innerHTML = html;
  
  if (assignees.includes(currentVal)) {
    select.value = currentVal;
  } else {
    filter.assignee = 'all';
    select.value = 'all';
  }
}

function setAssigneeFilter(val) {
  filter.assignee = val;
  saveFilter();
  renderTable();
}

function setCustomStatusFilter(val, btn) {
  filter.customStatus = val;
  btn.closest('.filter-bar').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  saveFilter();
  renderTable();
}

function setChildSortFilter(val) {
  filter.childSort = val;
  saveFilter();
  renderTable();
}

// ── テーマ切替 ────────────────────────────────────
function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  localStorage.setItem('bpm2-theme', next);
}

function applyTheme(theme) {
  const btn = document.getElementById('btnTheme');
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    btn.textContent = '🌙 ダーク';
  } else {
    document.documentElement.removeAttribute('data-theme');
    btn.textContent = '☀ ライト';
  }
}

// ── 起動 ─────────────────────────────────────────
applyTheme(localStorage.getItem('bpm2-theme') || 'dark');
loadFilter();
applyFilterUI();
loadFieldOptions();
fetchData();
</script>
