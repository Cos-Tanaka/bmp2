<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM / 日別実績工数表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
    --border: #30363d; --border2: #3d444d;
    --text: #e6edf3; --text2: #8d96a0; --text3: #6e7681;
    --accent: #388bfd; --accent2: #1f6feb;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --purple: #a371f7;
    --font: 'Noto Sans JP', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    color-scheme: dark;

    /* 土日祝・当日の列 */
    --sat-bg: rgba(56, 139, 253, 0.08);
    --hol-bg: rgba(248, 81, 73, 0.09);
    --sat-text: #79c0ff;
    --hol-text: #ff7b72;
    --today-line: var(--accent);
    --grp-bg: #1a2230;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --bg4: #f1f3f5;
    --border: #d0d7de; --border2: #afb8c1;
    --text: #1f2328; --text2: #57606a; --text3: #8c959f;
    --accent: #0969da; --accent2: #0550ae;
    --green: #1a7f37; --yellow: #9a6700; --red: #cf222e; --purple: #8250df;
    color-scheme: light;

    --sat-bg: rgba(9, 105, 218, 0.07);
    --hol-bg: rgba(207, 34, 46, 0.07);
    --sat-text: #0969da;
    --hol-text: #cf222e;
    --grp-bg: #eef4fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* Header */
  .header {
    background: var(--bg2); border-bottom: 1px solid var(--border); flex: none;
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .05em; }
  .logo span { color: var(--text2); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .sync-info { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    display: inline-block; margin-right: 6px; box-shadow: 0 0 6px var(--green);
  }
  .sync-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .sync-dot.loading { background: var(--yellow); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .btn-refresh, .btn-theme {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text2); padding: 4px 12px; font-size: 12px; cursor: pointer;
    font-family: var(--font); transition: .15s; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-refresh:hover, .btn-theme:hover { border-color: var(--accent); color: var(--text); }
  .btn-refresh.active-nav { background: var(--accent2); border-color: var(--accent); color: #fff; }

  /* Toolbar */
  .toolbar {
    background: var(--bg2); border-bottom: 1px solid var(--border); flex: none;
    padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label { font-size: 11px; color: var(--text3); font-weight: 500; }
  .filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .note { font-size: 11px; color: var(--text3); }

  .chip {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 20px;
    padding: 3px 12px; font-size: 11px; cursor: pointer; color: var(--text2); transition: .15s;
    user-select: none; font-family: var(--font);
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent2); border-color: var(--accent); color: #fff; }

  /* 期間ナビゲーション */
  .period-nav { display: flex; align-items: center; gap: 6px; background: var(--bg3); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--border); }
  .period-btn {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 4px;
    color: var(--text2); padding: 2px 8px; font-size: 11px; cursor: pointer; transition: .15s; font-family: var(--font);
  }
  .period-btn:hover { border-color: var(--accent); color: var(--text); }
  .period-title { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); padding: 0 6px; min-width: 76px; text-align: center; }

  /* 担当者 複数選択ドロップダウン */
  .multi-wrap { position: relative; display: inline-block; }
  .multi-btn {
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text2); padding: 3px 10px; font-size: 11px; cursor: pointer;
    font-family: var(--font); transition: .15s; white-space: nowrap;
  }
  .multi-btn:hover { border-color: var(--accent); color: var(--text); }
  .multi-panel {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 200;
    background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); padding: 8px 12px; min-width: 200px; max-height: 360px;
    overflow-y: auto;
  }
  .multi-panel.open { display: block; }
  .multi-panel label {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 12px;
    cursor: pointer; border-radius: 4px; color: var(--text);
  }
  .multi-panel label:hover { background: var(--bg3); }
  .multi-actions {
    display: flex; justify-content: space-between; padding-bottom: 6px; margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .multi-actions button {
    background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer; padding: 2px 4px;
  }

  /* マトリクス表 */
  .table-scroll { flex: 1; overflow: auto; position: relative; background: var(--bg); }
  table.dm {
    border-collapse: separate; border-spacing: 0; font-size: 12px;
  }
  table.dm th, table.dm td {
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    white-space: nowrap; text-align: right; padding: 4px 4px;
  }
  table.dm thead th {
    background: var(--bg2); color: var(--text2); font-weight: 600; position: sticky; z-index: 20;
    font-family: var(--mono); font-size: 11px; text-align: center;
  }
  table.dm thead tr:nth-child(1) th { top: 0; height: 24px; }
  table.dm thead tr:nth-child(2) th { top: 24px; font-family: var(--font); font-weight: 400; font-size: 10px; }
  table.dm .c-label {
    text-align: left; position: sticky; left: 0; z-index: 10; background: var(--bg);
    width: 380px; min-width: 380px; max-width: 380px; overflow: hidden; text-overflow: ellipsis;
    padding: 4px 10px; box-shadow: 2px 0 6px rgba(0,0,0,0.12);
  }
  table.dm .c-total {
    position: sticky; left: 380px; z-index: 10; background: var(--bg3);
    width: 64px; min-width: 64px; font-weight: 700; font-family: var(--mono); padding: 4px 8px;
    border-right: 2px solid var(--border2);
  }
  table.dm thead .c-label, table.dm thead .c-total { z-index: 30; background: var(--bg2); }
  table.dm .c-day { width: 38px; min-width: 38px; font-family: var(--mono); }
  table.dm thead th.c-label { text-align: left; }

  /* 土日祝・当日 */
  table.dm .sat { background: var(--sat-bg); }
  table.dm .hol { background: var(--hol-bg); }
  table.dm thead th.sat { color: var(--sat-text); }
  table.dm thead th.hol { color: var(--hol-text); }
  table.dm thead th.sat { background-image: linear-gradient(var(--sat-bg), var(--sat-bg)); }
  table.dm thead th.hol { background-image: linear-gradient(var(--hol-bg), var(--hol-bg)); }
  table.dm .today { box-shadow: inset 1px 0 0 var(--today-line), inset -1px 0 0 var(--today-line); }
  table.dm thead th.today { color: var(--accent); font-weight: 700; }

  /* 行種別 */
  tr.r-grand td { background: var(--bg2); font-weight: 700; }
  tr.r-grand td.c-label, tr.r-grand td.c-total { background: var(--bg3); }
  tr.r-group td { background: var(--grp-bg); font-weight: 700; border-top: 1px solid var(--border2); }
  tr.r-group td.c-label { background: var(--grp-bg); cursor: pointer; }
  tr.r-group td.c-total { background: var(--grp-bg); }
  tr.r-group.sum td, tr.r-group.sum td.c-label, tr.r-group.sum td.c-total { background: var(--bg3); }
  tr.r-item td.c-label { padding-left: 32px; color: var(--text2); }
  tr.r-item:hover td { background-color: var(--bg3); }
  tr.r-item:hover td.c-label, tr.r-item:hover td.c-total { background: var(--bg4); }
  td.zero { color: var(--text3); }
  .twisty { display: inline-block; width: 14px; color: var(--text3); font-size: 10px; }
  .grp-count {
    font-size: 10px; color: var(--text3); background: var(--bg4); border-radius: 10px;
    padding: 1px 6px; font-family: var(--mono); margin-left: 6px; font-weight: 400;
  }
  .fixed-badge {
    font-size: 10px; color: var(--purple); border: 1px solid var(--purple); border-radius: 4px;
    padding: 0 5px; margin-right: 6px; font-weight: 500;
  }
  tr.r-group.after-fixed td { border-top: 3px double var(--border2); }
  .issue-key { color: var(--accent); font-family: var(--mono); font-size: 11px; text-decoration: none; margin-right: 6px; }
  .issue-key:hover { text-decoration: underline; }

  .state-message { padding: 48px; text-align: center; color: var(--text3); font-size: 14px; line-height: 1.8; }
</style>

<body>

<div class="header">
  <div style="display:flex;align-items:center;">
    <div class="logo">BPM <span>/ 進捗監視盤</span></div>
  </div>
  <div class="header-right">
    <div class="sync-info"><span class="sync-dot" id="syncDot"></span><span id="syncText">待機中</span></div>
    <a class="btn-refresh" href="/index.html" style="text-decoration:none">📋 一覧</a>
    <a class="btn-refresh" href="/gantt.html" style="text-decoration:none">📅 ガント</a>
    <a class="btn-refresh" href="/workload.html" style="text-decoration:none">📊 月別工数</a>
    <a class="btn-refresh active-nav" href="/worklog-matrix.html" style="text-decoration:none">🗓 日別実績</a>

    <a class="btn-refresh" href="/guide.html" target="_blank" rel="noopener" style="text-decoration:none">❓ 使い方</a>
    <button class="btn-refresh" onclick="fetchData()">↻ 更新</button>
    <button class="btn-theme" onclick="toggleTheme()" id="btnTheme" title="テーマ切り替え">🌙</button>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-group">
    <div class="period-nav">
      <button class="period-btn" onclick="shiftMonth(-1)">◀ 前月</button>
      <span class="period-title" id="periodTitle">----/--</span>
      <button class="period-btn" onclick="shiftMonth(1)">翌月 ▶</button>
      <button class="period-btn" onclick="goThisMonth()" style="font-weight:bold;margin-left:4px">📍今月</button>
    </div>

    <div class="filter-sep"></div>

    <span class="filter-label">行の並び:</span>
    <button class="chip" data-mode="project" onclick="setMode('project')">📋 案件 → 担当者</button>
    <button class="chip" data-mode="assignee" onclick="setMode('assignee')">👤 担当者 → 案件</button>

    <div class="filter-sep"></div>

    <div class="multi-wrap">
      <button type="button" class="multi-btn" id="nameMultiBtn" onclick="toggleNamePanel(event)">👥 担当者: 全員</button>
      <div class="multi-panel" id="nameMultiPanel"></div>
    </div>

    <div class="filter-sep"></div>

    <button class="chip" onclick="setAllCollapsed(false)">▼ 全て開く</button>
    <button class="chip" onclick="setAllCollapsed(true)">▶ 全て閉じる</button>
  </div>

  <div class="toolbar-group">
    <button class="btn-refresh" onclick="openFixedModal()" style="font-size:11px;padding:3px 10px;">✏️ 固定作業の工数登録</button>
    <span class="note">※ BPMの実績入力（日付付き）で登録された工数のみ集計</span>
    <button class="btn-refresh" onclick="exportCsv()" style="font-size:11px;padding:3px 10px;">📥 CSVダウンロード</button>
    <button class="btn-refresh" onclick="importMaintenanceHours()" id="btnMaintImport" style="font-size:11px;padding:3px 10px;">🔄 保守工数を取得</button>
    <span class="note" id="maintImportMsg"></span>
  </div>
</div>

<div class="table-scroll" id="tableContainer">
  <div class="state-message">データを読み込み中...</div>
</div>

<script src="fixed-modal.js"></script>
<script>
// ── グローバル状態 ──────────────────────────────────
let logRows = [];                 // /api/worklog/search の結果 [{parentKey, parentTitle, parentUrl, name, day, hours}]
let mode = 'project';             // 'project'（案件 → 担当者）| 'assignee'（担当者 → 案件）
let ym = { year: 0, month: 0 };   // 表示中の年月（month は 1 始まり）
let selectedNames = [];           // 担当者の絞り込み（空＝全員）
const collapsed = new Set();      // 閉じているグループのキー（'sum' ＝集計ブロック, 'g:<key>'）
let currentView = null;           // CSV 出力用に直近の描画結果を保持

const POLL_MS = 60000;
const MODE_KEY  = 'bpm2-daily-mode';
const NAMES_KEY = 'bpm2-daily-names';
const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

// 固定の作業区分（定義は fixed-modal.js）。案件 → 担当者の並びでは、実績が無い月も集計の直下に常に表示する。
const FIXED_CATEGORIES = FixedModal.CATEGORIES;
const FIXED_INDEX = FixedModal.INDEX;

window.addEventListener('DOMContentLoaded', async () => {
  initTheme();
  loadSavedSettings();
  // 登録した日の月を表示して、結果が表に出ていることを確認できるようにする
  FixedModal.init({
    onSaved: async (date) => {
      const [y, m] = date.split('-').map(Number);
      ym = { year: y, month: m };
      await fetchData();
    },
  });
  goThisMonth(false);
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('nameMultiPanel');
    if (panel.classList.contains('open') && !e.target.closest('.multi-wrap')) panel.classList.remove('open');
  });
  await fetchData();
  setInterval(fetchData, POLL_MS);
});

// ── テーマ ────────────────────────────────────────
function initTheme() {
  const t = localStorage.getItem('bpm2-theme') || 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('bpm2-theme', next);
  document.getElementById('btnTheme').textContent = next === 'dark' ? '☀️' : '🌙';
}

// ── 設定の保存・復元 ──────────────────────────────
function loadSavedSettings() {
  const m = localStorage.getItem(MODE_KEY);
  if (m === 'project' || m === 'assignee') mode = m;
  try {
    const n = JSON.parse(localStorage.getItem(NAMES_KEY) || '[]');
    if (Array.isArray(n)) selectedNames = n.filter(x => typeof x === 'string');
  } catch (e) {}
  syncModeChips();
}
function syncModeChips() {
  document.querySelectorAll('.chip[data-mode]').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
}
function setMode(m) {
  if (m === mode) return;
  mode = m;
  localStorage.setItem(MODE_KEY, m);
  // グループのキーは並びごとに意味が変わるので、開閉状態は持ち越さない
  collapsed.clear();
  syncModeChips();
  render();
}

// ── 期間 ──────────────────────────────────────────
function goThisMonth(doRender = true) {
  const now = new Date();
  ym = { year: now.getFullYear(), month: now.getMonth() + 1 };
  if (doRender) render();
}
function shiftMonth(delta) {
  let m = ym.month + delta, y = ym.year;
  while (m > 12) { m -= 12; y++; }
  while (m < 1)  { m += 12; y--; }
  ym = { year: y, month: m };
  render();
}
function ymPrefix() { return `${ym.year}-${String(ym.month).padStart(2, '0')}`; }

// ── 日本の祝日 ────────────────────────────────────
// Backlog には祝日カレンダーが無いため、祝日法（2020年以降の日付）に沿って計算する。
// 振替休日と「国民の休日」（祝日に挟まれた平日）も含める。
const holidayCache = {};
function holidaysOf(year) {
  if (holidayCache[year]) return holidayCache[year];
  const set = new Set();
  const key = (m, d) => `${m}-${d}`;
  const nthMonday = (m, n) => {
    const first = new Date(year, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  };
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m, d]) => set.add(key(m, d)));
  set.add(key(1, nthMonday(1, 2)));   // 成人の日
  set.add(key(7, nthMonday(7, 3)));   // 海の日
  set.add(key(9, nthMonday(9, 3)));   // 敬老の日
  set.add(key(10, nthMonday(10, 2))); // スポーツの日
  const leap = Math.floor((year - 1980) / 4);
  set.add(key(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - leap))); // 春分の日
  set.add(key(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - leap))); // 秋分の日

  const isHol = (d) => set.has(key(d.getMonth() + 1, d.getDate()));
  const extra = [];
  for (let d = new Date(year, 0, 2); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
    const prev = new Date(d); prev.setDate(d.getDate() - 1);
    const next = new Date(d); next.setDate(d.getDate() + 1);
    // 国民の休日: 前後が祝日の平日
    if (!isHol(d) && d.getDay() !== 0 && isHol(prev) && isHol(next)) extra.push(key(d.getMonth() + 1, d.getDate()));
  }
  extra.forEach(k => set.add(k));
  // 振替休日: 日曜の祝日の後、最初の祝日でない日
  for (let d = new Date(year, 0, 1); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0 && isHol(d)) {
      const s = new Date(d);
      do { s.setDate(s.getDate() + 1); } while (isHol(s));
      if (s.getFullYear() === year) set.add(key(s.getMonth() + 1, s.getDate()));
    }
  }
  holidayCache[year] = set;
  return set;
}

function monthDays() {
  const n = new Date(ym.year, ym.month, 0).getDate();
  const hol = holidaysOf(ym.year);
  const t = new Date();
  const todayStr = `${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`;
  const days = [];
  for (let d = 1; d <= n; d++) {
    const wd = new Date(ym.year, ym.month - 1, d).getDay();
    const isHoliday = wd === 0 || hol.has(`${ym.month}-${d}`);
    days.push({
      d, wd,
      cls: isHoliday ? 'hol' : wd === 6 ? 'sat' : '',
      today: todayStr === `${ym.year}-${ym.month}-${d}`,
    });
  }
  return days;
}

// ── API 取得 ──────────────────────────────────────
async function fetchData() {
  setSyncState('loading');
  try {
    const res = await fetch('/api/worklog/search?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    logRows = await res.json();
    renderNamePanel();
    render();
    setSyncState('ok');
  } catch (e) {
    setSyncState('error', e.message);
  }
}
// ── 保守作業（FIX-MAINT）取り込み ─────────────────────
// シートは月度が変わると過去分を参照できないため、取得タイミングをこのボタンでユーザーに委ねる。
async function importMaintenanceHours() {
  const btn = document.getElementById('btnMaintImport');
  const msg = document.getElementById('maintImportMsg');
  btn.disabled = true;
  msg.style.color = '';
  msg.textContent = '取得中...';
  try {
    const res = await fetch('/api/fixed-worklog/maintenance-import', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    msg.textContent = `✅ ${data.month} の保守作業を取り込みました（${data.people}名 / ${data.entries}件 / 計${data.totalHours}h）`;
    const [y, m] = data.month.split('-').map(Number);
    ym = { year: y, month: m };
    await fetchData();
  } catch (e) {
    msg.style.color = '#e53e3e';
    msg.textContent = '取得に失敗しました: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function setSyncState(state, err = '') {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot ' + (state === 'error' ? 'error' : state === 'loading' ? 'loading' : '');
  if (state === 'ok') txt.textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' 同期済';
  else if (state === 'loading') txt.textContent = '同期中...';
  else txt.textContent = 'エラー: ' + err;
}

// ── 担当者 複数選択 ───────────────────────────────
// 候補は全期間の作業ログに出てくる名前（入力時の自由記述）。月を移っても候補が変わらないようにする。
function allNames() {
  return [...new Set(logRows.map(r => r.name))].sort((a, b) => a.localeCompare(b, 'ja'));
}
function renderNamePanel() {
  const panel = document.getElementById('nameMultiPanel');
  const names = allNames();
  panel.innerHTML = `<div class="multi-actions">
      <button type="button" onclick="setNames(allNames())">すべて選択</button>
      <button type="button" onclick="setNames([])">クリア（全員）</button>
    </div>` + (names.length ? names.map(n => `<label><input type="checkbox" value="${escAttr(n)}"
      ${selectedNames.includes(n) ? 'checked' : ''} onchange="onNameCheck(this)"> ${escHtml(n)}</label>`).join('')
      : '<div class="note" style="padding:6px">入力履歴がありません</div>');
  updateNameBtn();
}
function toggleNamePanel(e) {
  e.stopPropagation();
  document.getElementById('nameMultiPanel').classList.toggle('open');
}
function onNameCheck(cb) {
  const set = new Set(selectedNames);
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  setNames([...set], false);
}
function setNames(list, rerenderPanel = true) {
  // 全員にチェックした状態は「絞り込みなし」と同じ扱いにする
  selectedNames = list.length === allNames().length ? [] : list;
  localStorage.setItem(NAMES_KEY, JSON.stringify(selectedNames));
  if (rerenderPanel) renderNamePanel(); else updateNameBtn();
  render();
}
function updateNameBtn() {
  const btn = document.getElementById('nameMultiBtn');
  btn.textContent = selectedNames.length === 0 ? '👥 担当者: 全員'
    : selectedNames.length <= 2 ? `👥 担当者: ${selectedNames.join('、')}`
    : `👥 担当者: ${selectedNames.length}名`;
}

// ── 集計 ──────────────────────────────────────────
function projectSortKey(key) {
  const m = String(key).match(/^(.*?)-(\d+)$/);
  return m ? [m[1], Number(m[2])] : [String(key), 0];
}
function compareProjects(a, b) {
  // 固定区分は定義順で Backlog の案件より前に並べる
  const fa = FIXED_INDEX[a], fb = FIXED_INDEX[b];
  if (fa !== undefined || fb !== undefined) {
    return fa === undefined ? 1 : fb === undefined ? -1 : fa - fb;
  }
  const [pa, na] = projectSortKey(a), [pb, nb] = projectSortKey(b);
  return pa === pb ? na - nb : pa.localeCompare(pb);
}
function compareNames(a, b) { return a.localeCompare(b, 'ja'); }

function newAcc(key, label, extra = {}) {
  return { key, label, total: 0, byDay: {}, ...extra };
}
function addTo(acc, day, h) {
  acc.total += h;
  acc.byDay[day] = (acc.byDay[day] || 0) + h;
}

// 表示月の作業ログを「外側 → 内側」の2階層に集計する。
// 集計ブロックは内側の軸（案件→担当者なら担当者、担当者→案件なら案件）で全体を束ねたもの。
function buildView() {
  const prefix = ymPrefix() + '-';
  const nameFilter = selectedNames.length ? new Set(selectedNames) : null;
  const rows = logRows.filter(r => r.day && r.day.startsWith(prefix) && (!nameFilter || nameFilter.has(r.name)));

  const projects = {};   // parentKey → { title, url }
  rows.forEach(r => {
    // 同じ親でも古いログはタイトルが古い可能性がある。API は最新のタイトルで返すのでそのまま使う
    projects[r.parentKey] = { title: r.parentTitle || '', url: r.parentUrl || '' };
  });
  // 固定区分は名称を定義側で固定し、Backlog へのリンクは持たない
  FIXED_CATEGORIES.forEach(c => { projects[c.key] = { title: c.title, url: '', fixed: true }; });
  const projLabel = (k) => ({ key: k, ...projects[k] });

  const outerOf = (r) => mode === 'project' ? r.parentKey : r.name;
  const innerOf = (r) => mode === 'project' ? r.name : r.parentKey;
  const outerCmp = mode === 'project' ? compareProjects : compareNames;
  const innerCmp = mode === 'project' ? compareNames : compareProjects;
  const isProj = (level) => (mode === 'project') === (level === 'outer');

  const grand = newAcc('grand', '合計');
  const summary = {};
  const groups = {};
  if (mode === 'project') {
    FIXED_CATEGORIES.forEach(c => { groups[c.key] = newAcc(c.key, c.key, { items: {} }); });
  }
  rows.forEach(r => {
    const day = Number(r.day.slice(8, 10));
    const h = Number(r.hours) || 0;
    const o = outerOf(r), i = innerOf(r);
    addTo(grand, day, h);
    addTo(summary[i] ||= newAcc(i, i), day, h);
    const g = groups[o] ||= newAcc(o, o, { items: {} });
    addTo(g, day, h);
    addTo(g.items[i] ||= newAcc(i, i), day, h);
  });

  const decorate = (acc, level) => {
    if (isProj(level)) acc.project = projLabel(acc.key);
    return acc;
  };
  const summaryList = Object.values(summary).sort((a, b) => innerCmp(a.key, b.key)).map(a => decorate(a, 'inner'));
  const groupList = Object.values(groups).sort((a, b) => outerCmp(a.key, b.key)).map(g => {
    decorate(g, 'outer');
    g.itemList = Object.values(g.items).sort((a, b) => innerCmp(a.key, b.key)).map(a => decorate(a, 'inner'));
    return g;
  });
  return { days: monthDays(), grand, summaryList, groupList, logCount: rows.length };
}

// ── 描画 ──────────────────────────────────────────
function fmt(h) {
  if (!h) return '';
  return String(Math.round(h * 100) / 100);
}
function labelHtml(acc) {
  if (acc.project) {
    const p = acc.project;
    if (p.fixed) return `<span class="fixed-badge">固定</span>` + escHtml(p.title);
    const key = p.url
      ? `<a class="issue-key" href="${escAttr(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escHtml(p.key)}</a>`
      : `<span class="issue-key">${escHtml(p.key)}</span>`;
    return key + escHtml(p.title);
  }
  return escHtml(acc.label);
}
function labelTitle(acc) {
  if (!acc.project) return acc.label;
  return acc.project.fixed ? acc.project.title : `${acc.project.key} ${acc.project.title}`;
}
function dayCells(acc, days) {
  return days.map(dd => {
    const v = acc.byDay[dd.d];
    return `<td class="c-day ${dd.cls}${dd.today ? ' today' : ''}">${fmt(v)}</td>`;
  }).join('');
}
function groupRow(gkey, acc, labelInner, count, extraCls = '') {
  const open = !collapsed.has(gkey);
  return `<tr class="r-group ${extraCls}">
      <td class="c-label" data-gkey="${escAttr(gkey)}" onclick="toggleGroup(this.dataset.gkey)" title="${escAttr(labelTitle(acc))}">
        <span class="twisty">${count ? (open ? '▼' : '▶') : ''}</span>${labelInner}<span class="grp-count">${count}</span></td>
      <td class="c-total">${fmt(acc.total) || '0'}</td>
      ${dayCells(acc, currentView.days)}
    </tr>`;
}
function itemRows(gkey, list) {
  if (collapsed.has(gkey)) return '';
  return list.map(a => `<tr class="r-item">
      <td class="c-label" title="${escAttr(labelTitle(a))}">${labelHtml(a)}</td>
      <td class="c-total">${fmt(a.total) || '0'}</td>
      ${dayCells(a, currentView.days)}
    </tr>`).join('');
}

function render() {
  document.getElementById('periodTitle').textContent = `${ym.year}/${String(ym.month).padStart(2, '0')}`;
  const container = document.getElementById('tableContainer');
  currentView = buildView();
  const { days, grand, summaryList, groupList } = currentView;

  if (!groupList.length) {
    const filtered = selectedNames.length ? '（担当者の絞り込み中）' : '';
    container.innerHTML = `<div class="state-message">${ym.year}年${ym.month}月の実績工数の入力はありません${filtered}。<br>
      <span style="font-size:12px">一覧・ガント・月別工数の子課題詳細から「実績工数」を日付付きで入力すると、ここに日別で表示されます。</span></div>`;
    return;
  }

  const summaryLabel = mode === 'project' ? '集計（担当者別）' : '集計（案件別）';
  const head = `<thead>
      <tr>
        <th class="c-label" rowspan="2">${mode === 'project' ? '案件 / 担当者' : '担当者 / 案件'}</th>
        <th class="c-total" rowspan="2">合計</th>
        ${days.map(dd => `<th class="c-day ${dd.cls}${dd.today ? ' today' : ''}">${dd.d}</th>`).join('')}
      </tr>
      <tr>${days.map(dd => `<th class="c-day ${dd.cls}${dd.today ? ' today' : ''}">${WEEKDAYS[dd.wd]}</th>`).join('')}</tr>
    </thead>`;

  let body = `<tr class="r-grand">
      <td class="c-label">全体合計</td>
      <td class="c-total">${fmt(grand.total) || '0'}</td>
      ${dayCells(grand, days)}
    </tr>`;
  body += groupRow('sum', { total: grand.total, byDay: grand.byDay, label: summaryLabel }, escHtml(summaryLabel), summaryList.length, 'sum');
  body += itemRows('sum', summaryList);
  groupList.forEach((g, idx) => {
    const gkey = 'g:' + g.key;
    // 固定区分と Backlog の案件の境目に区切り線を入れる
    const prevFixed = idx > 0 && groupList[idx - 1].project?.fixed;
    const cls = prevFixed && !g.project?.fixed ? 'after-fixed' : '';
    body += groupRow(gkey, g, labelHtml(g), g.itemList.length, cls);
    body += itemRows(gkey, g.itemList);
  });

  const scroll = { top: container.scrollTop, left: container.scrollLeft };
  container.innerHTML = `<table class="dm">${head}<tbody>${body}</tbody></table>`;
  container.scrollTop = scroll.top;
  container.scrollLeft = scroll.left;
}

function toggleGroup(gkey) {
  collapsed.has(gkey) ? collapsed.delete(gkey) : collapsed.add(gkey);
  render();
}
function setAllCollapsed(close) {
  collapsed.clear();
  if (close && currentView) {
    collapsed.add('sum');
    currentView.groupList.forEach(g => collapsed.add('g:' + g.key));
  }
  render();
}

// ── CSV エクスポート ──────────────────────────────────
// 開閉状態に関係なく全行を出力する（Excel の実施工数管理と同じく 外側 → 内側 の並び）。
function exportCsv() {
  if (!currentView) return;
  const { days, grand, summaryList, groupList } = currentView;
  const outerName = mode === 'project' ? '案件' : '担当者';
  const innerName = mode === 'project' ? '担当者' : '案件';
  const nameOf = labelTitle;
  const line = (c1, c2, acc) => [c1, c2, fmt(acc.total) || '0', ...days.map(dd => fmt(acc.byDay[dd.d]))];

  const out = [[outerName, innerName, '合計', ...days.map(dd => `${dd.d}日(${WEEKDAYS[dd.wd]})`)]];
  out.push(line('全体合計', '', grand));
  summaryList.forEach(a => out.push(line('集計', nameOf(a), a)));
  groupList.forEach(g => {
    out.push(line(nameOf(g), '（計）', g));
    g.itemList.forEach(a => out.push(line(nameOf(g), nameOf(a), a)));
  });

  const csv = '﻿' + out.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `BPM2_日別実績工数_${ymPrefix()}_${mode === 'project' ? '案件別' : '担当者別'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── ユーティリティ ──────────────────────────────────
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escAttr(str) { return escHtml(str); }
</script>
