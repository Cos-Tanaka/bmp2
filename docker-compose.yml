version: "3.9"

services:
  backend:
    build: ./backend
    container_name: bpm-backend
    restart: unless-stopped
    environment:
      - BACKLOG_SPACE=${BACKLOG_SPACE}        # 例: yourspace.backlog.com
      - BACKLOG_API_KEY=${BACKLOG_API_KEY}    # Backlog API キー
      - BACKLOG_PROJECT_KEY=${BACKLOG_PROJECT_KEY}  # 例: ASPIT
      - CACHE_TTL=${CACHE_TTL:-60}            # キャッシュ秒数（デフォルト60秒）
      - DB_PATH=/app/data/worklog.db          # 実績工数 入力履歴の SQLite 保存先
    volumes:
      - bpm-data:/app/data                    # SQLite 永続化
    networks:
      - bpm-net

  frontend:
    build: ./frontend
    container_name: bpm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3031:80"
    volumes:
      # 静的ファイルはイメージに焼き込まず bind mount で配信する。
      # これにより html を変更しても再ビルド不要で restart だけで反映できる
      # （イメージ再ビルドは export に 2〜3 分かかるため）。
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bpm-net

networks:
  bpm-net:
    driver: bridge

volumes:
  bpm-data:
